<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Möbius / Chebyshev Viewer</title>
    <style>
      :root {
        --pad: 12px;
      }

      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }

      header {
        padding: var(--pad) calc(var(--pad) * 1.5);
        border-bottom: 1px solid #eee;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 22px;
      }

      .tabs {
        display: flex;
        gap: 8px;
        margin: 8px 0 12px;
      }

      .tab {
        padding: 6px 12px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        cursor: pointer;
        border-radius: 6px;
        font-size: 13px;
      }

      .tab.active {
        background: #fff;
        border-color: #888;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08) inset;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 8px;
        align-items: end;
      }

      .group {
        grid-column: span 3;
        display: grid;
        gap: 4px;
        font-size: 12px;
      }

      .group.wide {
        grid-column: span 6;
      }

      .controls input,
      .controls select,
      .controls button {
        width: 100%;
        padding: 6px 8px;
        font-size: 13px;
      }

      .wrap {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 12px;
        padding: 12px;
        box-sizing: border-box;
        height: calc(100vh - 96px);
      }

      .panel-left {
        border-right: 1px solid #eee;
        padding-right: 12px;
        overflow-y: auto;
      }

      .panel-left h2 {
        font-size: 14px;
        margin: 10px 0 6px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
      }

      .stack svg {
        background: #fafafa;
        border: 1px solid #ddd;
        flex: 1;
        width: 100%;
      }

      .hint {
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- later we can add D3 here if needed -->
    <!-- <script src="../node_modules/d3/dist/d3.min.js"></script> -->

    <script type="module" src="../dist/renderer.js"></script>
  </body>
</html>
