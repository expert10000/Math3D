name: Prepare source-built Python scientific worker
description: Provide the required Windows Python/VTK runtime for source-built Electron qualification without assuming optional CGAL is installed
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install pinned required Python worker dependencies
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check numpy==2.4.6 scipy==1.17.1 sympy==1.14.0 vtk==9.7.0
    - name: Verify source-worker health and required scientific imports
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $lines = & python python/worker/main.py --health
        if ($LASTEXITCODE -ne 0) { throw "Python worker health probe exited $LASTEXITCODE" }
        $last = $lines | Where-Object { $_ -match '"type"\s*:\s*"health"' } | Select-Object -Last 1
        if (-not $last) { throw "Worker health JSON is missing" }
        $health = $last | ConvertFrom-Json
        if (-not $health.ok) { throw "Python worker health failed: $last" }
        foreach ($name in @('numpy', 'scipy', 'sympy', 'vtk')) {
          $dependency = $health.dependencies.PSObject.Properties[$name].Value
          if (-not $dependency -or -not $dependency.ok) {
            throw "Required worker dependency missing: $name"
          }
        }
        Write-Host 'Required Python worker health: PASS'
        Write-Host "Optional CGAL/pygalmesh status (not certified): $($health.dependencies.CGAL.ok) / $($health.dependencies.pygalmesh.ok)"
        $pythonExe = (& python -c "import sys; print(sys.executable)").Trim()
        if (-not (Test-Path -LiteralPath $pythonExe)) { throw "Resolved Python executable is unavailable" }
        "MATH3D_PYTHON=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "MATH3D_WORKER_MODE=python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
