name: Release Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$') {
            throw "Tag '$tag' is not a valid semver tag (example: v1.2.3 or v1.2.3-beta.1)."
          }

          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install npm dependencies (root + renderer, retry)
        shell: pwsh
        run: |
          function Invoke-NpmWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][scriptblock]$Command,
              [Parameter(Mandatory = $true)][string]$CleanupPath,
              [int]$MaxAttempts = 3
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "[$Label] attempt $attempt/$MaxAttempts"
              $output = & $Command 2>&1
              $exitCode = $LASTEXITCODE
              if ($output) {
                $output | ForEach-Object { Write-Host $_ }
              }

              if ($exitCode -eq 0) {
                return
              }

              $outputText = ($output | Out-String)
              $lockMismatch = ($outputText -match "npm error code EUSAGE") -and (
                ($outputText -match "can only install packages when your package\.json and package-lock\.json") -or
                ($outputText -match "Invalid:\s+lock file") -or
                ($outputText -match "Please update your lock file with")
              )
              if ($lockMismatch) {
                throw "[$Label] failed with lockfile mismatch. npm ci cannot proceed when package.json and package-lock.json are out of sync. Run npm install locally, commit updated lockfiles, and rerun CI."
              }

              if ($attempt -eq $MaxAttempts) {
                throw "[$Label] failed after $MaxAttempts attempts (exit $exitCode)."
              }

              Write-Warning "[$Label] failed with exit $exitCode. Cleaning up and retrying..."
              if (Test-Path $CleanupPath) {
                Remove-Item -Recurse -Force $CleanupPath -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          Invoke-NpmWithRetry -Label "root npm ci" -Command { npm ci } -CleanupPath "node_modules"
          Invoke-NpmWithRetry -Label "renderer npm ci" -Command { npm --prefix renderer ci } -CleanupPath "renderer/node_modules"

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.meta.outputs.version }}

      - name: Install Python dependencies for frozen worker
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
          python -m pip install pyinstaller numpy scipy sympy vtk
          python -m pip install pygalmesh
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Optional dependency pygalmesh failed to install; continuing without mesh.generate support."
            $global:LASTEXITCODE = 0
          }

      - name: Build docs bundle
        shell: pwsh
        run: |
          if (Test-Path "docs/api") {
            Remove-Item -Recurse -Force "docs/api"
          }
          npm run docs:api
          npm run docs:site

      - name: Build web app bundle
        run: npm run build:web

      - name: Build Windows installer
        run: npm run dist:ci

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $assetsDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

          $setup = Get-ChildItem -Path "release" -Filter "Math3D Setup *.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw "Installer not found in release directory."
          }
          Copy-Item $setup.FullName (Join-Path $assetsDir "Math3D-Setup-$version.exe") -Force

          $winUnpacked = Join-Path $PWD "release/win-unpacked"
          if (Test-Path $winUnpacked) {
            Compress-Archive -Path (Join-Path $winUnpacked "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-$version-win-portable.zip") `
              -Force
          } else {
            Write-Warning "release/win-unpacked not found; skipping portable zip."
          }

          $docsSite = Join-Path $PWD "site"
          if (Test-Path $docsSite) {
            Compress-Archive -Path (Join-Path $docsSite "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-docs-$version.zip") `
              -Force
          } else {
            Write-Warning "site directory not found; skipping docs zip."
          }

          $webDist = Join-Path $PWD "apps/web/dist"
          if (Test-Path $webDist) {
            Compress-Archive -Path (Join-Path $webDist "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-web-$version.zip") `
              -Force
          } else {
            Write-Warning "apps/web/dist not found; skipping web app zip."
          }

          $optionalFiles = @(
            "release/latest.yml",
            "release/builder-debug.yml"
          )
          foreach ($file in $optionalFiles) {
            if (Test-Path $file) {
              Copy-Item $file $assetsDir -Force
            }
          }

          Push-Location $assetsDir
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Pop-Location

          "asset_glob=release-assets/*" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release bundle artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          path: release-assets/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.assets.outputs.asset_glob }}

  linux-packages-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$tag' is not a valid semver tag." >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix renderer ci

      - name: Install frozen worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy vtk

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.meta.outputs.version }}

      - name: Build Linux packages
        run: npm run dist:linux:ci

      - name: Smoke packaged worker
        run: |
          test -x release/linux-unpacked/resources/python-worker/worker
          release/linux-unpacked/resources/python-worker/worker --ping
          release/linux-unpacked/resources/python-worker/worker --version
          node scripts/smoke-python-worker.mjs --exe release/linux-unpacked/resources/python-worker/worker

      - name: Install deb and smoke installed worker
        run: |
          sudo apt-get update
          sudo apt-get install -y ./release/*.deb
          installed_worker="$(find /opt -path '*/resources/python-worker/worker' -type f -print -quit)"
          test -n "$installed_worker"
          test -x "$installed_worker"
          node scripts/smoke-python-worker.mjs --exe "$installed_worker"

      - name: Install rpm on Fedora 44 and smoke installed worker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            fedora:44 \
            bash -lc '
              dnf install -y nodejs ./release/*.rpm
              installed_desktop="$(find /usr/share/applications -iname "*math3d*.desktop" -type f -print -quit)"
              installed_worker="$(find /opt -path "*/resources/python-worker/worker" -type f -print -quit)"
              test -n "$installed_desktop"
              test -n "$installed_worker"
              test -x "$installed_worker"
              node scripts/smoke-python-worker.mjs --exe "$installed_worker"
            '

      - name: Prepare Linux release assets
        id: assets
        shell: bash
        run: |
          mkdir -p release-assets-linux
          appimage="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "AppImage not found in release directory." >&2
            exit 1
          fi
          output="release-assets-linux/Math3D-${{ steps.meta.outputs.version }}-linux-x86_64.AppImage"
          cp "$appimage" "$output"
          deb="$(find release -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [[ -z "$deb" ]]; then
            echo "deb package not found in release directory." >&2
            exit 1
          fi
          cp "$deb" "release-assets-linux/Math3D-${{ steps.meta.outputs.version }}-linux-amd64.deb"
          rpm="$(find release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          if [[ -z "$rpm" ]]; then
            echo "rpm package not found in release directory." >&2
            exit 1
          fi
          cp "$rpm" "release-assets-linux/Math3D-${{ steps.meta.outputs.version }}-linux-x86_64.rpm"
          (
            cd release-assets-linux
            sha256sum Math3D-*
          ) > release-assets-linux/SHA256SUMS-linux.txt
          echo "asset_glob=release-assets-linux/*" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          path: release-assets-linux/*

      - name: Publish Linux packages to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: ${{ steps.assets.outputs.asset_glob }}
