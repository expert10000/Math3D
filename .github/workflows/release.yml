name: Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mobile-release-gate:
    # The 1.7.0 desktop release does not publish a new Android artifact.
    # Keep Android build/emulator regression coverage; physical-device signoff
    # remains required for a separately distributed Android build.
    if: ${{ !contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/mobile-android.yml
    with:
      release_ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      require_device_signoff: false
    secrets: inherit

  windows-release:
    needs: mobile-release-gate
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Apply exact workflow build recipe to fixed app tag
        run: node -e "eval(require('node:child_process').execFileSync('git', ['show', process.env.GITHUB_WORKFLOW_SHA + ':scripts/materialize-release-recipe.cjs'], {encoding:'utf8'}))"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Release tag is required."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$') {
            throw "Tag '$tag' is not a valid semver tag (example: v1.2.3 or v1.2.3-beta.1)."
          }

          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install npm dependencies (root + renderer, retry)
        shell: pwsh
        run: |
          function Invoke-NpmWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][scriptblock]$Command,
              [Parameter(Mandatory = $true)][string]$CleanupPath,
              [int]$MaxAttempts = 3
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "[$Label] attempt $attempt/$MaxAttempts"
              $output = & $Command 2>&1
              $exitCode = $LASTEXITCODE
              if ($output) {
                $output | ForEach-Object { Write-Host $_ }
              }

              if ($exitCode -eq 0) {
                return
              }

              $outputText = ($output | Out-String)
              $lockMismatch = ($outputText -match "npm error code EUSAGE") -and (
                ($outputText -match "can only install packages when your package\.json and package-lock\.json") -or
                ($outputText -match "Invalid:\s+lock file") -or
                ($outputText -match "Please update your lock file with")
              )
              if ($lockMismatch) {
                throw "[$Label] failed with lockfile mismatch. npm ci cannot proceed when package.json and package-lock.json are out of sync. Run npm install locally, commit updated lockfiles, and rerun CI."
              }

              if ($attempt -eq $MaxAttempts) {
                throw "[$Label] failed after $MaxAttempts attempts (exit $exitCode)."
              }

              Write-Warning "[$Label] failed with exit $exitCode. Cleaning up and retrying..."
              if (Test-Path $CleanupPath) {
                Remove-Item -Recurse -Force $CleanupPath -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          Invoke-NpmWithRetry -Label "root npm ci" -Command { npm ci } -CleanupPath "node_modules"
          Invoke-NpmWithRetry -Label "renderer npm ci" -Command { npm --prefix renderer ci } -CleanupPath "renderer/node_modules"

      - name: Verify reusable Graph test pack
        run: node scripts/graph2d-release-test-pack.mjs

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.meta.outputs.version }}

      - name: Verify public license compliance metadata
        run: npm run verify:license-compliance

      - name: Test release SBOM generators
        run: node scripts/test-release-sbom.mjs

      - name: Resolve native binary cache
        id: native-cache-key
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $PWD ".cache/vcpkg-binaries"
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "key=windows-2022-$env:ImageVersion-vcpkg-52fd90f2b7798d9fe6fef18fc1787db44574d704" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore native dependency binaries
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/vcpkg-binaries
          key: ${{ steps.native-cache-key.outputs.key }}

      - name: Install Python dependencies for frozen worker
        id: native-deps
        shell: pwsh
        run: |
          ./scripts/setup-cgal-python-worker.ps1 -Python (Get-Command python).Source -VcpkgCommit 52fd90f2b7798d9fe6fef18fc1787db44574d704 -FrozenRequirements
          $workerPython = Join-Path $PWD ".venv-worker/Scripts/python.exe"
          & $workerPython -m pip install pyinstaller mkdocs -r python/worker/requirements.freeze.txt
          if ($LASTEXITCODE -ne 0) { throw "Pinned worker dependencies failed." }
          "MATH3D_PYTHON=$workerPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $PWD ".venv-worker/Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $PWD ".deps/vcpkg/installed/x64-windows/bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save native dependency cache before packaging
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/vcpkg-binaries
          key: ${{ steps.native-cache-key.outputs.key }}

      - name: Build docs bundle
        shell: pwsh
        run: |
          if (Test-Path "docs/api") {
            Remove-Item -Recurse -Force "docs/api"
          }
          npm run docs:api
          npm run docs:site

      - name: Build web app bundle
        run: npm run build:web

      - name: Build Windows installer
        env:
          MATH3D_REQUIRE_PYGALMESH: "1"
          MATH3D_REQUIRE_CGAL: "1"
        run: npm run dist:ci

      - name: Verify packaged worker protocol
        run: node scripts/smoke-python-worker.mjs --exe release/win-unpacked/resources/python-worker/worker.exe

      - name: Generate Windows release SBOM
        run: node scripts/generate-release-sbom.mjs --target windows --app-dir release/win-unpacked --out release-sbom --version "${{ steps.meta.outputs.version }}"

      - name: Preserve verified Windows build before source downloads
        uses: actions/upload-artifact@v7
        with:
          name: windows-verified-build-${{ github.run_id }}
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.exe
            release/win-unpacked/**
            site/**
            apps/web/dist/**
            release-sbom/**

      - name: Prepare corresponding source assets
        shell: pwsh
        run: |
          npm run release:source -- --target windows --out release-source --version "${{ steps.meta.outputs.version }}"

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $assetsDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

          $setup = Get-ChildItem -Path "release" -Filter "Math3D Setup *.exe" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw "Installer not found in release directory."
          }
          Copy-Item $setup.FullName (Join-Path $assetsDir "Math3D-Setup-$version.exe") -Force

          $winUnpacked = Join-Path $PWD "release/win-unpacked"
          if (Test-Path $winUnpacked) {
            Compress-Archive -Path (Join-Path $winUnpacked "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-$version-win-portable.zip") `
              -Force
          } else {
            Write-Warning "release/win-unpacked not found; skipping portable zip."
          }

          $docsSite = Join-Path $PWD "site"
          if (Test-Path $docsSite) {
            Compress-Archive -Path (Join-Path $docsSite "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-docs-$version.zip") `
              -Force
          } else {
            Write-Warning "site directory not found; skipping docs zip."
          }

          $webDist = Join-Path $PWD "apps/web/dist"
          if (Test-Path $webDist) {
            Compress-Archive -Path (Join-Path $webDist "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-web-$version.zip") `
              -Force
          } else {
            Write-Warning "apps/web/dist not found; skipping web app zip."
          }

          Get-ChildItem -Path "release-source" -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $assetsDir $_.Name) -Force
          }

          Get-ChildItem -Path "release-sbom" -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $assetsDir $_.Name) -Force
          }

          $testPack = Join-Path $PWD "docs/test-packs/$version"
          if (Test-Path $testPack) {
            Compress-Archive -Path (Join-Path $testPack "*") `
              -DestinationPath (Join-Path $assetsDir "Math3D-$version-test-pack.zip") -Force
          }

          $optionalFiles = @(
            "release/latest.yml",
            "release/builder-debug.yml"
          )
          foreach ($file in $optionalFiles) {
            if (Test-Path $file) {
              Copy-Item $file $assetsDir -Force
            }
          }

          Push-Location $assetsDir
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "SHA256SUMS.txt" -Encoding ascii
          Pop-Location

          "asset_glob=release-assets/*" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release bundle artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          path: release-assets/*

  linux-release:
    needs: [mobile-release-gate, windows-release]
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"
      MATH3D_CHANNEL: stable
      MATH3D_GPU_MODE: disabled
      MATH3D_SKIP_AUTOSAVE_RECOVERY: "1"
      MATH3D_START_MAXIMIZED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Apply exact workflow build recipe to fixed app tag
        run: node -e "eval(require('node:child_process').execFileSync('git', ['show', process.env.GITHUB_WORKFLOW_SHA + ':scripts/materialize-release-recipe.cjs'], {encoding:'utf8'}))"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Ubuntu desktop/package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            rpm \
            unzip \
            xvfb
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\.-]+)?(\+[0-9A-Za-z\.-]+)?$ ]]; then
            echo "Tag '$tag' is not a valid semver tag (example: v1.2.3 or v1.2.3-beta.1)." >&2
            exit 1
          fi

          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix renderer ci

      - name: Install native pygalmesh build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcgal-dev libeigen3-dev

      - name: Set package version from tag
        run: npm version --no-git-tag-version --allow-same-version ${{ steps.meta.outputs.version }}

      - name: Verify public license compliance metadata
        run: npm run verify:license-compliance

      - name: Test release SBOM generators
        run: node scripts/test-release-sbom.mjs

      - name: Ensure Linux Electron binary
        env:
          MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "600000"
        run: timeout --kill-after=20s 10m npm run ensure:electron

      - name: Install Python dependencies for frozen worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r python/worker/requirements.freeze.txt

      - name: Build app before Ubuntu smoke
        run: npm run build:core

      - name: Run Ubuntu startup smoke
        env:
          MATH3D_STARTUP_SMOKE_TIMEOUT_MS: "180000"
        run: timeout --kill-after=20s 5m xvfb-run -a npm run test:app:startup:smoke

      - name: Run Ubuntu geometry smoke
        env:
          MATH3D_GEOMETRY_SMOKE_TIMEOUT_MS: "180000"
        run: timeout --kill-after=20s 5m xvfb-run -a npm run test:app:geometry:smoke

      - name: Build Linux packages
        env:
          MATH3D_REQUIRE_PYGALMESH: "1"
          MATH3D_REQUIRE_CGAL: "1"
        run: npm run dist:linux:ci

      - name: Generate Linux release SBOM
        run: node scripts/generate-release-sbom.mjs --target linux --app-dir release/linux-unpacked --out release-sbom --version "${{ steps.meta.outputs.version }}"

      - name: Preserve built Linux packages before source downloads
        uses: actions/upload-artifact@v7
        with:
          name: linux-built-packages-${{ github.run_id }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release-sbom/**

      - name: Prepare corresponding source assets
        run: npm run release:source -- --target linux --out release-source --version "${{ steps.meta.outputs.version }}"

      - name: Prepare Linux release assets
        id: assets
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          assets_dir="$PWD/release-assets-linux"
          mkdir -p "$assets_dir"

          copy_latest() {
            local pattern="$1"
            local dest="$2"
            local source
            source="$(ls -t $pattern 2>/dev/null | head -n 1 || true)"
            if [[ -z "$source" ]]; then
              echo "Expected Linux package not found: $pattern" >&2
              exit 1
            fi
            cp "$source" "$assets_dir/$dest"
          }

          copy_latest "release/*.AppImage" "Math3D-$version-linux-x64.AppImage"
          copy_latest "release/*.deb" "Math3D-$version-linux-x64.deb"
          copy_latest "release/*.rpm" "Math3D-$version-linux-x64.rpm"

          if [[ -f "release/latest-linux.yml" ]]; then
            cp "release/latest-linux.yml" "$assets_dir/latest-linux.yml"
          fi
          if [[ -f "release/builder-debug.yml" ]]; then
            cp "release/builder-debug.yml" "$assets_dir/builder-debug-linux.yml"
          fi

          cp release-source/* "$assets_dir/"
          cp release-sbom/* "$assets_dir/"

          (
            cd "$assets_dir"
            sha256sum * > SHA256SUMS-linux.txt
          )

          echo "asset_glob=release-assets-linux/*" >> "$GITHUB_OUTPUT"

      - name: Upload Linux release bundle artifact (debug)
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets-${{ steps.meta.outputs.tag }}
          if-no-files-found: error
          path: release-assets-linux/*

  theory-lab-installer:
    needs: mobile-release-gate
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out pinned Theory Lab source
        uses: actions/checkout@v7
        with:
          repository: expert10000/theory-lab
          ref: 3c883fa4a69da2ee9f59b1425ac181094a25c276
      - name: Record source revision
        id: source
        shell: pwsh
        run: |
          "sha=$((& git rev-parse HEAD).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build pinned Lab installer
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab npm ci failed' }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab venv creation failed' }
          & .\.venv\Scripts\python.exe -m pip install -c workers/quantum-python/requirements.lock -e workers/quantum-python
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab pinned worker install failed' }
          & .\.venv\Scripts\python.exe -m pip install -r workers/quantum-python/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab frozen worker dependencies failed' }
          $env:CI = 'false'
          npm run package:win:installer -- --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab NSIS build failed' }
      - name: Upload exact Lab installer
        uses: actions/upload-artifact@v7
        with:
          name: release-theory-lab-installer
          if-no-files-found: error
          compression-level: 0
          path: release/Quantum-Hamiltonian-Lab-Setup-*.exe

  clean-install-gate:
    needs: [windows-release, theory-lab-installer]
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: expert10000/theory-lab
          ref: ${{ needs.theory-lab-installer.outputs.source_sha }}
          path: theory-lab
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: release-theory-lab-installer
          path: lab-installer
      - name: Pin the exact installer bytes
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $math = (Resolve-Path -LiteralPath "release-assets/Math3D-Setup-$version.exe").Path
          $lab = @(Get-ChildItem -LiteralPath lab-installer -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          if ($lab.Count -ne 1) { throw 'Expected exactly one Lab installer' }
          $mathSource = (& git rev-parse HEAD).Trim()
          $labSource = (& git -C theory-lab rev-parse HEAD).Trim()
          if ($labSource -ne '${{ needs.theory-lab-installer.outputs.source_sha }}') { throw 'Lab checkout drifted from build' }
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          Copy-Item -LiteralPath $math -Destination (Join-Path candidate ([IO.Path]::GetFileName($math)))
          Copy-Item -LiteralPath $lab[0].FullName -Destination (Join-Path candidate $lab[0].Name)
          [ordered]@{
            schema = 'math3d/two-app-candidate/v1'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            buildRunId = $env:GITHUB_RUN_ID
            math3d = [ordered]@{
              version = (Get-Content package.json -Raw | ConvertFrom-Json).version
              commit = $mathSource
              channel = 'stable'
              installerName = [IO.Path]::GetFileName($math)
              installerSha256 = (Get-FileHash -LiteralPath $math -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            theoryLab = [ordered]@{
              version = (Get-Content theory-lab/package.json -Raw | ConvertFrom-Json).version
              commit = $labSource
              installerName = $lab[0].Name
              installerSha256 = (Get-FileHash -LiteralPath $lab[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath candidate/candidate-manifest.json -Encoding UTF8
          if ((Get-Content candidate/candidate-manifest.json -Raw | ConvertFrom-Json).math3d.version -ne $version) {
            throw 'Final tag and frozen source package version differ'
          }
      - name: Install exact final files and run clean Lab handoff
        shell: pwsh
        run: |
          $manifest = Get-Content candidate/candidate-manifest.json -Raw | ConvertFrom-Json
          & scripts/stable-two-app-signoff.ps1 -TheoryLabRepo theory-lab `
            -Math3DInstaller (Join-Path candidate $manifest.math3d.installerName) `
            -TheoryLabInstaller (Join-Path candidate $manifest.theoryLab.installerName) `
            -CandidateManifest candidate/candidate-manifest.json `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'final-clean-install') `
            -EvidencePath (Join-Path $PWD 'test-results/final-clean-install.json')
          if ($LASTEXITCODE -ne 0) { throw 'Final clean-install gate failed' }
      - name: Preserve exact final pair and clean evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-clean-install-evidence
          if-no-files-found: ignore
          compression-level: 0
          path: |
            candidate/*
            test-results/final-clean-install.json
            test-results/playwright/quantum-installed-ui-round*/trace.zip

  upgrade-gate:
    needs: [windows-release, theory-lab-installer, clean-install-gate]
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: final-clean-install-evidence
          path: clean-evidence
      - uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: release-theory-lab-installer
          path: lab-installer
      - name: Require identical files to clean-install gate
        shell: pwsh
        run: |
          $manifest = Get-Content clean-evidence/candidate/candidate-manifest.json -Raw | ConvertFrom-Json
          foreach ($pair in @(
            @((Join-Path release-assets $manifest.math3d.installerName), $manifest.math3d.installerSha256),
            @((Join-Path lab-installer $manifest.theoryLab.installerName), $manifest.theoryLab.installerSha256)
          )) {
            $actual = (Get-FileHash -LiteralPath $pair[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $pair[1]) { throw "Installer changed between gates: $($pair[0])" }
          }
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          Copy-Item clean-evidence/candidate/* candidate/
      - name: Download published v1.6.0 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path published -Force | Out-Null
          gh release download v1.6.0 --repo expert10000/Math3D --pattern 'Math3D-Setup-1.6.0.exe' --dir published
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.6.0 download failed' }
      - name: Upgrade v1.6.0 with the exact final files
        shell: pwsh
        run: |
          & scripts/stable-upgrade-two-app-signoff.ps1 `
            -PublishedInstaller published/Math3D-Setup-1.6.0.exe `
            -CandidateDirectory candidate `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'final-upgrade') `
            -EvidencePath (Join-Path $PWD 'test-results/final-upgrade.json')
          if ($LASTEXITCODE -ne 0) { throw 'Final v1.6.0 upgrade gate failed' }
      - name: Preserve upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-upgrade-evidence
          if-no-files-found: ignore
          path: |
            test-results/final-upgrade.json
            test-results/playwright/stable-upgrade-project-settings*/trace.zip
            test-results/playwright/quantum-installed-ui-round*/trace.zip

  publish-release:
    needs: [windows-release, linux-release, theory-lab-installer, clean-install-gate, upgrade-gate]
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets
      - uses: actions/download-artifact@v7
        with:
          name: linux-release-assets-${{ env.RELEASE_TAG }}
          path: release-assets-linux
      - uses: actions/download-artifact@v7
        with:
          name: final-clean-install-evidence
          path: clean-evidence
      - uses: actions/download-artifact@v7
        with:
          name: final-upgrade-evidence
          path: upgrade-evidence
      - name: Test release evidence verifier
        run: node scripts/test-stable-release-gates.mjs
      - name: Verify both gates and exact publish bytes
        run: node scripts/verify-stable-release-gates.mjs
      - name: Publish tested stable assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/*
            release-assets-linux/*
            clean-evidence/candidate/Quantum-Hamiltonian-Lab-Setup-*.exe
            clean-evidence/candidate/candidate-manifest.json
            clean-evidence/test-results/final-clean-install.json
            upgrade-evidence/test-results/final-upgrade.json
