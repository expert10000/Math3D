name: Windows QI-40 Fresh Pair Source Journey

on:
  workflow_dispatch:
    inputs:
      use_retained_fixture:
        description: Replay the checked-in byte-exact QWZ subset after the Actions artifact expires
        required: false
        default: false
        type: boolean
      pair_run_id:
        description: Successful unsigned Dev pair run containing the fresh QWZ artifact
        required: false
        type: string
      pair_artifact_name:
        description: Exact artifact name from that run
        required: false
        type: string
      pair_report_sha256:
        description: SHA-256 of the archived installed-pair.json
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  fresh-qwz-source-journey:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      electron_config_cache: '${{ github.workspace }}\.cache\electron'
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: '600000'
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: '180000'
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Check pair run and receipt identity
        if: ${{ !inputs.use_retained_fixture }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PAIR_RUN_ID: ${{ inputs.pair_run_id }}
          PAIR_ARTIFACT_NAME: ${{ inputs.pair_artifact_name }}
          PAIR_REPORT_SHA256: ${{ inputs.pair_report_sha256 }}
        run: |
          if ($env:PAIR_RUN_ID -notmatch '^[0-9]+$' -or
              $env:PAIR_ARTIFACT_NAME -notmatch '^qi40-unsigned-dev-pair-[0-9]+$' -or
              $env:PAIR_REPORT_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw 'Pair run, artifact, or report hash input is invalid'
          }
          $run = gh run view $env:PAIR_RUN_ID -R expert10000/Math3D --json conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.conclusion -ne 'success') { throw 'Pair run has not passed' }
      - uses: actions/download-artifact@v7
        if: ${{ !inputs.use_retained_fixture }}
        with:
          name: ${{ inputs.pair_artifact_name }}
          repository: expert10000/Math3D
          run-id: ${{ inputs.pair_run_id }}
          github-token: ${{ github.token }}
          path: pair-artifact
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
      - name: Build identified source app
        shell: pwsh
        run: |
          npm ci --foreground-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Root npm ci failed' }
          npm --prefix renderer ci --foreground-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Renderer npm ci failed' }
          npm run build:core
          if ($LASTEXITCODE -ne 0) { throw 'Source build failed' }
          $identity = Get-Content dist/build-identity.json -Raw | ConvertFrom-Json
          if ($identity.dirty -or $identity.commit -ne $env:GITHUB_SHA) { throw 'Source build identity differs from checkout' }
      - name: Recheck exact fresh result and two views
        shell: pwsh
        env:
          PAIR_ROOT: ${{ inputs.use_retained_fixture && 'tests/fixtures/quantum-qi40-fresh-pair-artifact' || 'pair-artifact' }}
          PAIR_REPORT_SHA256: ${{ inputs.use_retained_fixture && 'f4c2c74ab1c87f398454bf9297d641e329550df04d583427125f661355d00a42' || inputs.pair_report_sha256 }}
        run: |
          New-Item -ItemType Directory -Force -Path qi40-source-evidence | Out-Null
          $review = node scripts/review-qi40-installed-pair.mjs $env:PAIR_ROOT $env:PAIR_REPORT_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Fresh QWZ pair review failed' }
          $review | Set-Content -LiteralPath qi40-source-evidence/fresh-pair-review.json -Encoding utf8
      - name: Run complete QWZ Study and Graph source journey
        shell: pwsh
        env:
          MATH3D_QI40_PAIR_ARTIFACT_ROOT: ${{ inputs.use_retained_fixture && 'tests/fixtures/quantum-qi40-fresh-pair-artifact' || 'pair-artifact' }}
          MATH3D_QI40_PAIR_REPORT_SHA256: ${{ inputs.use_retained_fixture && 'f4c2c74ab1c87f398454bf9297d641e329550df04d583427125f661355d00a42' || inputs.pair_report_sha256 }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: qi40-source-evidence/playwright.json
        run: |
          npx playwright test tests/e2e/quantum-qi08-study-handoff.spec.ts --workers=1 --retries=0 --reporter=list,json
          if ($LASTEXITCODE -ne 0) { throw 'Fresh QWZ source journey failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qi40-fresh-pair-source-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            dist/build-identity.json
            qi40-source-evidence/
            test-results/playwright/
