name: Workbench layout and forms native regression
on:
  push:
    branches: [main, codex/m3d20-layout-forms]
    paths:
      - renderer/src/App.tsx
      - renderer/src/math/complexExplorerLayout.css
      - renderer/src/components/MeshOperationsPanel.tsx
      - renderer/src/components/ContextualActionStrip.tsx
      - tests/e2e/complex-explorer-layout.spec.ts
      - tests/e2e/mesh-operation-form.spec.ts
      - .github/workflows/workbench-layout-forms.yml
  pull_request:
    branches: [main]
    paths:
      - renderer/src/App.tsx
      - renderer/src/math/complexExplorerLayout.css
      - renderer/src/components/MeshOperationsPanel.tsx
      - renderer/src/components/ContextualActionStrip.tsx
      - tests/e2e/complex-explorer-layout.spec.ts
      - tests/e2e/mesh-operation-form.spec.ts
      - .github/workflows/workbench-layout-forms.yml
permissions:
  contents: read
jobs:
  native-layout-forms:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHON: python
      NODE_OPTIONS: --max-old-space-size=6144
      electron_config_cache: '${{ github.workspace }}\.cache\electron'
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: '600000'
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: '180000'
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -c python/worker/requirements.freeze.txt numpy scipy sympy vtk
      - uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
      - run: npm ci --foreground-scripts && npm --prefix renderer ci --foreground-scripts
      - run: npm run typecheck:noemit && npm run build:core
      - name: Native 800 px Complex dock and Mesh operation forms
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ui-evidence/native.json
        run: |
          mkdir -p ui-evidence
          git rev-parse HEAD > ui-evidence/source.txt
          npx playwright test tests/e2e/complex-explorer-layout.spec.ts tests/e2e/mesh-operation-form.spec.ts --workers=1 --retries=0 --reporter=list,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workbench-layout-forms-evidence
          path: |
            ui-evidence/**
            dist/build-identity.json
            test-results/playwright/**
