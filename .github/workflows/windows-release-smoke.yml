name: Windows Installer Smoke

on:
  pull_request:
    types:
      - labeled
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      skip_launch_check:
        description: Skip installed app launch persistence check
        required: false
        default: true
        type: boolean
  repository_dispatch:
    types:
      - run-installer-smoke

concurrency:
  group: windows-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:installer-smoke' }}
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Install npm dependencies (root)
        run: npm ci

      - name: Install npm dependencies (renderer)
        run: npm --prefix renderer ci

      - name: Install Python dependencies for frozen worker
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy vtk
          python -m pip install pygalmesh
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Optional dependency pygalmesh failed to install; continuing without mesh.generate support."
            $global:LASTEXITCODE = 0
          }

      - name: Build installer, install, and run smoke tests
        shell: pwsh
        run: |
          $skipLaunchCheck = "${{ github.event.inputs.skip_launch_check }}"
          if ([string]::IsNullOrWhiteSpace($skipLaunchCheck)) {
            $skipLaunchCheck = "true"
          }

          if ($skipLaunchCheck -eq "true") {
            npm run test:release:smoke
          } else {
            powershell -ExecutionPolicy Bypass -File scripts/release-smoke.ps1 -StrictLaunchCheck
          }

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-artifacts
          if-no-files-found: warn
          path: |
            release/*.exe
            release/builder-debug.yml
            release/latest.yml
