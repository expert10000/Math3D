name: Windows Release Smoke

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  release-smoke:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install npm dependencies (root)
        run: npm ci

      - name: Install npm dependencies (renderer)
        run: npm --prefix renderer ci

      - name: Install Python dependencies for frozen worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy vtk

      - name: Build installer, install, and run smoke tests
        run: npm run test:release:smoke

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-smoke-artifacts
          path: |
            release/*.exe
            release/builder-debug.yml
            release/latest.yml
