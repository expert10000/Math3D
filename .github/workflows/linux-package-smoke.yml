name: Linux Package Smoke

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: linux-package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-package-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"
      MATH3D_CHANNEL: stable
      MATH3D_GPU_MODE: disabled
      MATH3D_RENDERER_MEMORY_AUTO_RELOAD: "1"
      MATH3D_SKIP_AUTOSAVE_RECOVERY: "1"
      MATH3D_START_MAXIMIZED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install Ubuntu desktop/package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            libatk-bridge2.0-0 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxss1 \
            rpm \
            unzip \
            xvfb
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install npm dependencies
        run: |
          npm ci
          npm --prefix renderer ci

      - name: Run TypeScript noEmit checks
        run: npm run typecheck:noemit

      - name: Ensure Linux Electron binary
        env:
          MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "600000"
        run: timeout --kill-after=20s 10m npm run ensure:electron

      - name: Install Python dependencies for frozen worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy vtk
          python -c "import numpy, scipy, sympy, vtk; print('Python worker smoke dependencies available')"
          python -m pip install pygalmesh || echo "Optional dependency pygalmesh failed to install; continuing without mesh.generate support."

      - name: Build app before Ubuntu smoke
        run: npm run build:core

      - name: Run Ubuntu startup smoke
        env:
          MATH3D_STARTUP_SMOKE_TIMEOUT_MS: "180000"
        run: timeout --kill-after=20s 5m xvfb-run -a npm run test:app:startup:smoke

      - name: Run Ubuntu geometry smoke
        env:
          MATH3D_GEOMETRY_SMOKE_TIMEOUT_MS: "180000"
        run: timeout --kill-after=20s 5m xvfb-run -a npm run test:app:geometry:smoke

      - name: Build Linux packages
        run: npm run dist:linux:ci

      - name: Upload Linux smoke packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-smoke
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-linux.yml
            release/builder-debug.yml
