name: Native CGAL Source To Binary Chain

on:
  push:
    branches: [main]
    paths:
      - "native/cgal-worker/**"
      - "scripts/*cgal*"
      - "scripts/prepare-public-source-bundle.mjs"
      - "scripts/generate-release-sbom.mjs"
      - "scripts/verify-release20-assets.mjs"
      - "scripts/test-release20-assets.mjs"
      - "compliance/public-source-manifest.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/native-cgal-chain.yml"
  pull_request:
    paths:
      - "native/cgal-worker/**"
      - "scripts/*cgal*"
      - "scripts/prepare-public-source-bundle.mjs"
      - "scripts/generate-release-sbom.mjs"
      - "scripts/verify-release20-assets.mjs"
      - "scripts/test-release20-assets.mjs"
      - "compliance/public-source-manifest.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/native-cgal-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require clean pinned source checkout
        shell: pwsh
        run: |
          if (git status --porcelain --untracked-files=no) { throw "Native chain requires clean tracked source" }
          git rev-parse HEAD | Out-File -FilePath native-chain-source.txt -Encoding utf8
      - name: Install pinned public build recipes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .deps -Force | Out-Null
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git .deps/vcpkg
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed" }
          git -C .deps/vcpkg checkout --detach 52fd90f2b7798d9fe6fef18fc1787db44574d704
          if ($LASTEXITCODE -ne 0) { throw "Pinned vcpkg checkout failed" }
          & .deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          & .deps/vcpkg/vcpkg.exe install cgal:x64-windows eigen3:x64-windows --binarysource=clear
          if ($LASTEXITCODE -ne 0) { throw "Pinned CGAL dependency build failed" }
      - name: Build frozen Python CGAL worker from matching public sources
        shell: pwsh
        run: |
          ./scripts/setup-cgal-python-worker.ps1 -Python (Get-Command python).Source -VcpkgCommit 52fd90f2b7798d9fe6fef18fc1787db44574d704 -FrozenRequirements -SkipVcpkgInstall
          if ($LASTEXITCODE -ne 0) { throw "Frozen CGAL worker build failed" }
          $workerPython = Join-Path $PWD ".venv-worker/Scripts/python.exe"
          & $workerPython -m pip install -r python/worker/build-requirements.freeze.txt -r python/worker/requirements.freeze.txt
          if ($LASTEXITCODE -ne 0) { throw "Frozen worker dependency verification failed" }
          "MATH3D_PYTHON=$workerPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $PWD ".venv-worker/Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $PWD ".deps/vcpkg/installed/x64-windows/bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native worker and prepare corresponding sources
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm --prefix renderer ci
          if ($LASTEXITCODE -ne 0) { throw "Renderer npm ci failed" }
          npm run build:main
          if ($LASTEXITCODE -ne 0) { throw "Main build failed" }
          npm run build:cgal-native-worker
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
          npm run release:source -- --target windows --out release-source --version 2.0.0
          if ($LASTEXITCODE -ne 0) { throw "Public source preparation failed" }
          npm run verify:cgal-native-source
          if ($LASTEXITCODE -ne 0) { throw "Public source verification failed" }
          node scripts/test-cgal-native-release.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native worker acceptance failed" }
          node scripts/write-native-cgal-build-receipt.mjs release-source/SOURCE_MANIFEST-windows.json
          if ($LASTEXITCODE -ne 0) { throw "Native build receipt failed" }
      - name: Enforce binary source and SBOM ownership gate
        shell: pwsh
        env:
          MATH3D_BUNDLE_NATIVE_CGAL: "1"
          MATH3D_NATIVE_CGAL_SOURCE_MANIFEST: ${{ github.workspace }}/release-source/SOURCE_MANIFEST-windows.json
        run: |
          node scripts/cgal-native-distribution-gate.cjs
          if ($LASTEXITCODE -ne 0) { throw "Native distribution gate failed" }
          node scripts/test-native-cgal-build-receipt.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native receipt tamper tests failed" }
      - name: Exercise SBOM and release asset fixtures
        shell: pwsh
        run: |
          node scripts/test-release-sbom.mjs
          if ($LASTEXITCODE -ne 0) { throw "SBOM ownership fixtures failed" }
          node scripts/test-release20-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw "Native release asset integrity fixtures failed" }
      - name: Upload source-to-binary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-cgal-source-binary-chain
          if-no-files-found: ignore
          path: |
            native-chain-source.txt
            release-source/**
            build/native/cgal-worker/NATIVE_BUILD_RECEIPT-windows.json
            build/native/cgal-worker/Release/math3d-cgal-worker.exe
            build/native/cgal-worker/Release/gmp-10.dll
            build/native/cgal-worker/Release/mpfr-6.dll
            .deps/vcpkg/installed/x64-windows/share/cgal/vcpkg.spdx.json
            .deps/vcpkg/installed/x64-windows/share/boost-core/vcpkg.spdx.json
            .deps/vcpkg/installed/x64-windows/share/gmp/vcpkg.spdx.json
            .deps/vcpkg/installed/x64-windows/share/mpfr/vcpkg.spdx.json
            .deps/vcpkg/installed/x64-windows/share/cgal/copyright
            .deps/vcpkg/installed/x64-windows/share/boost-core/copyright
            .deps/vcpkg/installed/x64-windows/share/gmp/copyright
            .deps/vcpkg/installed/x64-windows/share/mpfr/copyright
