name: Windows QI-40 Installed Pair

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Math3D signoff run containing the exact two-app-stable-candidate artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  installed-qwz-pair:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Check out QI-40 installed harness
        uses: actions/checkout@v7

      - name: Download exact candidate installers
        uses: actions/download-artifact@v7
        with:
          name: two-app-stable-candidate
          repository: expert10000/Math3D
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Read candidate source identity
        id: candidate
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'candidate/candidate-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'math3d/two-app-candidate/v1' -or
              $manifest.buildRunId -ne '${{ inputs.candidate_run_id }}' -or
              $manifest.theoryLab.commit -notmatch '^[a-f0-9]{40}$') {
            throw 'Candidate manifest identity is invalid'
          }
          "theory_lab_sha=$($manifest.theoryLab.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check out exact Theory Lab source
        uses: actions/checkout@v7
        with:
          repository: expert10000/theory-lab
          ref: ${{ steps.candidate.outputs.theory_lab_sha }}
          path: theory-lab

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Theory Lab acceptance harness
        working-directory: theory-lab
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab npm ci failed' }

      - name: Install both exact setups and accept QWZ handoff
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP ('qi40-installed-pair-' + [guid]::NewGuid().ToString('N'))
          & ./scripts/accept-qi40-installed-pair.ps1 -CandidateDirectory candidate -TheoryLabRepo theory-lab -InstallRoot $install -OutputRoot test-results/qi40-installed-pair

      - name: Archive exact installed QWZ evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qi40-installed-pair-${{ inputs.candidate_run_id }}
          if-no-files-found: ignore
          compression-level: 0
          path: test-results/qi40-installed-pair/
