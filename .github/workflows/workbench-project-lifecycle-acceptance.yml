name: Workbench Project lifecycle acceptance

on:
  push:
    branches: [codex/m3d20-project-lifecycle-fixes]
    paths:
      - '.github/workflows/workbench-project-lifecycle-acceptance.yml'
      - 'tests/e2e/workbench-project-lifecycle.spec.ts'
      - 'docs/ui/2.0/evidence/workbench-project-lifecycle/**'
  pull_request:
    branches: [main, codex/ui-aggregate-preview]
    paths:
      - '.github/workflows/workbench-project-lifecycle-acceptance.yml'
      - 'tests/e2e/workbench-project-lifecycle.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-project-lifecycle:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      electron_config_cache: '${{ github.workspace }}\.cache\electron'
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: '600000'
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: '180000'
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
      - run: npm ci --foreground-scripts && npm --prefix renderer ci --foreground-scripts
      - uses: ./.github/actions/source-python-worker
      - run: npm run typecheck:noemit && npm run build:core
      - name: Verify Mesh and Complex Project lifecycle
        shell: bash
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: workbench-lifecycle-evidence/native.json
        run: |
          mkdir -p workbench-lifecycle-evidence
          git rev-parse HEAD > workbench-lifecycle-evidence/source.txt
          npx playwright test tests/e2e/workbench-project-lifecycle.spec.ts --workers=1 --retries=0 --reporter=list,json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workbench-project-lifecycle-acceptance
          path: |
            workbench-lifecycle-evidence/**
            dist/build-identity.json
            test-results/playwright/**
