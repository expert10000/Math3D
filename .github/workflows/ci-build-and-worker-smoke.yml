            $global:LASTEXITCODE = 0
          }

      - name: Build app
        run: npm run build:core

      - name: Run slow Playwright app e2e tests
        run: npm run test:app:e2e:slow

      - name: Upload slow e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-slow-app-e2e-artifacts
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**
            output/memory-profiles/**
            output/release-checks/**
