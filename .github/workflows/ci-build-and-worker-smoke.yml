            }
          }

          Invoke-NpmWithRetry -Label "root npm ci" -Command { npm ci } -CleanupPath "node_modules"
          Invoke-NpmWithRetry -Label "renderer npm install" -Command { npm --prefix renderer install } -CleanupPath "renderer/node_modules"

      - name: Build app
        run: npm run build:core

      - name: Run Electron startup smoke test
        run: npm run test:app:startup:smoke

      - name: Run geometry functional smoke
        run: npm run test:app:geometry:smoke

      - name: Run Playwright smoke e2e tests
        run: npm run test:app:e2e:smoke

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-app-smoke-artifacts
          if-no-files-found: warn
          path: |
            playwright-report/**
            test-results/**

  slow-app-e2e:
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_slow_e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:slow-e2e'))
      }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Show Node version
        run: node --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
