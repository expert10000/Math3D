name: CI Build and Worker Smoke

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_worker_smoke:
        description: Run frozen worker smoke tests
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-build-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Install npm dependencies (root)
        run: npm ci

      - name: Install npm dependencies (renderer)
        run: npm --prefix renderer install

      - name: Run renderer unit tests
        run: npm --prefix renderer run test

      - name: Install Python dependencies for worker freeze
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy scipy sympy vtk
          python -m pip install pygalmesh
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Optional dependency pygalmesh failed to install; continuing without mesh.generate support."
            $global:LASTEXITCODE = 0
          }

      - name: Build app
        run: npm run build:core

      - name: Run startup functional smoke
        run: npm run test:app:startup:smoke

      - name: Run geometry functional smoke
        run: npm run test:app:geometry:smoke

      - name: Run worker smoke tests
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_worker_smoke == 'true' }}
        run: npm run test:worker:smoke

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-and-worker-smoke-artifacts
          if-no-files-found: warn
          path: |
            dist/**
            renderer/dist/**
            build/python-worker-dist/worker.exe
