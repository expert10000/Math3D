name: Mobile Android Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      use_shared_internal_signing:
        description: Validate the shared internal signing key without requiring device signoff
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_ref:
        description: Git tag or ref to validate for release
        required: false
        type: string
        default: ""
      require_device_signoff:
        description: Require signed-off physical-device evidence
        required: false
        type: boolean
        default: false
      use_shared_internal_signing:
        description: Use the shared internal signing key for a non-release validation run
        required: false
        type: boolean
        default: false
    secrets:
      MATH3D_ANDROID_INTERNAL_KEYSTORE_BASE64:
        required: false
      MATH3D_ANDROID_INTERNAL_STORE_PASSWORD:
        required: false
      MATH3D_ANDROID_INTERNAL_KEY_ALIAS:
        required: false
      MATH3D_ANDROID_INTERNAL_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.require_device_signoff }}

jobs:
  mobile-android:
    name: Mobile typecheck, APK, and emulator smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout mobile source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006
            cmake;3.22.1

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install locked dependencies
        run: npm ci

      - name: Restore npm install lockfile churn
        run: |
          changes="$(git status --porcelain --untracked-files=no)"
          if [[ -n "$changes" && "$changes" != ' M yarn.lock' ]]; then
            echo "Unexpected tracked changes after npm ci: $changes" >&2
            exit 1
          fi
          if [[ "$changes" == ' M yarn.lock' ]]; then
            git restore -- yarn.lock
          fi

      - name: Verify mobile identity and typecheck
        run: |
          npm run mobile:version:check
          npm --prefix apps/mobile run typecheck

      - name: Validate physical-device signoff for release
        if: ${{ inputs.require_device_signoff }}
        run: |
          node scripts/mobile-device-signoff.mjs
          node scripts/mobile-release-backup-check.mjs

      - name: Generate disposable CI signing key
        if: ${{ !inputs.require_device_signoff && !inputs.use_shared_internal_signing }}
        run: npm run mobile:signing:internal:init

      - name: Provision shared internal signing key
        if: ${{ inputs.require_device_signoff || inputs.use_shared_internal_signing }}
        env:
          KEYSTORE_BASE64: ${{ secrets.MATH3D_ANDROID_INTERNAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MATH3D_ANDROID_INTERNAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATH3D_ANDROID_INTERNAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATH3D_ANDROID_INTERNAL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Shared internal signing secrets are required for a release run.' >&2
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobile-internal.jks"
          {
            echo "MATH3D_ANDROID_INTERNAL_KEYSTORE_PATH=$RUNNER_TEMP/mobile-internal.jks"
            echo "MATH3D_ANDROID_INTERNAL_STORE_PASSWORD=$STORE_PASSWORD"
            echo "MATH3D_ANDROID_INTERNAL_KEY_ALIAS=$KEY_ALIAS"
            echo "MATH3D_ANDROID_INTERNAL_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build installable internal APK
        run: npm run mobile:android:internal

      - name: Verify tracked source stayed clean
        run: |
          changes="$(git status --porcelain --untracked-files=no)"
          test -z "$changes" || { echo "Tracked source changed during build: $changes" >&2; exit 1; }
          node -e "if (require('./artifacts/mobile/build-info.json').trackedSourceDirty) process.exit(1)"

      - name: Verify APK signature and SHA-256
        run: |
          (cd artifacts/mobile && sha256sum -c SHA256SUMS)
          apk="$(node -p "'artifacts/mobile/' + require('./artifacts/mobile/build-info.json').artifact")"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/mobile-apksigner.txt"
          if [[ "${{ inputs.require_device_signoff }}" == "true" || "${{ inputs.use_shared_internal_signing }}" == "true" ]]; then
            expected="$(node -p "require('./docs/mobile-device-signoff.json').signingCertSha256")"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/mobile-apksigner.txt")"
            test "$actual" = "$expected" || {
              echo 'Internal signing certificate differs from the device-tested APK.' >&2
              exit 1
            }
          fi

      - name: Run focused Workspace smoke on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node scripts/mobile-android-emulator-smoke.mjs

      - name: Upload APK, hashes, and smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/mobile/Math3D-mobile-*-internal.apk
            artifacts/mobile/build-info.json
            artifacts/mobile/SHA256SUMS
            output/mobile-android-smoke/**
            output/mobile-device-signoff-gate.json
