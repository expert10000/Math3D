# Optional unsigned installer check for a source checkout. The signed 2.0 candidate uses release20-candidate.yml.
name: Windows Unsigned Installer Smoke

on:
  pull_request:
    types:
      - labeled
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_launch_check:
        description: Skip installed app launch persistence check
        required: false
        default: true
        type: boolean
      run_four_journeys:
        description: Run four 2.0 journeys on installed unsigned Dev app using live Sage
        required: false
        default: false
        type: boolean
      run_upgrade_rehearsal:
        description: Rehearse published 1.7 profile through a same-directory unsigned Dev overlay
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - run-installer-smoke

concurrency:
  group: windows-unsigned-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'ci:installer-smoke' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: 'npm'

      - name: Show Node version
        run: node --version

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/worker/requirements.freeze.txt

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install npm dependencies (root + renderer, retry)
        shell: pwsh
        run: |
          function Invoke-NpmWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][scriptblock]$Command,
              [Parameter(Mandatory = $true)][string]$CleanupPath,
              [int]$MaxAttempts = 3
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "[$Label] attempt $attempt/$MaxAttempts"
              $output = & $Command 2>&1
              $exitCode = $LASTEXITCODE
              if ($output) {
                $output | ForEach-Object { Write-Host $_ }
              }

              if ($exitCode -eq 0) {
                return
              }

              $outputText = ($output | Out-String)
              $lockMismatch = ($outputText -match "npm error code EUSAGE") -and (
                ($outputText -match "can only install packages when your package\.json and package-lock\.json") -or
                ($outputText -match "Invalid:\s+lock file") -or
                ($outputText -match "Please update your lock file with")
              )
              if ($lockMismatch) {
                throw "[$Label] failed with lockfile mismatch. npm ci cannot proceed when package.json and package-lock.json are out of sync. Run npm install locally, commit updated lockfiles, and rerun CI."
              }

              if ($attempt -eq $MaxAttempts) {
                throw "[$Label] failed after $MaxAttempts attempts (exit $exitCode)."
              }

              Write-Warning "[$Label] failed with exit $exitCode. Cleaning up and retrying..."
              if (Test-Path $CleanupPath) {
                Remove-Item -Recurse -Force $CleanupPath -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          Invoke-NpmWithRetry -Label "root npm ci" -Command { npm ci } -CleanupPath "node_modules"
          Invoke-NpmWithRetry -Label "renderer npm install" -Command { npm --prefix renderer install } -CleanupPath "renderer/node_modules"

      - name: Run renderer unit tests
        run: npm --prefix renderer run test

      - name: Run TypeScript noEmit checks
        run: npm run typecheck:noemit

      - name: Install Python dependencies for frozen worker
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c python/worker/build-requirements.freeze.txt -c python/worker/requirements.freeze.txt pyinstaller numpy scipy sympy vtk
          python -c "import numpy, scipy, sympy, vtk; print('Python worker smoke dependencies available')"
          python -m pip install -c python/worker/requirements.freeze.txt pygalmesh
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Optional dependency pygalmesh failed to install; continuing without mesh.generate support."
            $global:LASTEXITCODE = 0
          }

      - name: Build app
        run: npm run build:core

      - name: Run Electron startup smoke test
        run: npm run test:app:startup:smoke

      - name: Run geometry functional smoke
        run: npm run test:app:geometry:smoke

      - name: Build unsigned Dev installer, install, and run source smoke
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          MATH3D_WINDOWS_TIMESTAMP_URL: ""
        run: |
          $skipLaunchCheck = "${{ github.event.inputs.skip_launch_check }}"
          if ([string]::IsNullOrWhiteSpace($skipLaunchCheck)) {
            $skipLaunchCheck = "true"
          }

          if ($skipLaunchCheck -eq "true") {
            ./scripts/release-smoke.ps1 -SourceDev -SkipLaunchCheck
          } else {
            ./scripts/release-smoke.ps1 -SourceDev -StrictLaunchCheck
          }

      - name: Run packaged Playwright e2e tests
        if: ${{ !inputs.run_four_journeys && !inputs.run_upgrade_rehearsal }}
        shell: pwsh
        run: |
          $env:MATH3D_RUN_PACKAGED_E2E = "1"
          $env:MATH3D_INSTALL_ROOT = Join-Path $env:RUNNER_TEMP 'Math3D-smoke-install'
          $env:MATH3D_INSTALLED_APP_EXE = Join-Path $env:MATH3D_INSTALL_ROOT 'Math3D Dev.exe'
          npm run test:app:e2e:packaged

      - name: Run four journeys against installed unsigned Dev app
        if: ${{ inputs.run_four_journeys }}
        shell: pwsh
        env:
          MATH3D_RELEASE20_SAGE_SERVICE_URL: ${{ secrets.MATH3D_RELEASE20_SAGE_SERVICE_URL }}
        run: |
          $app = Join-Path $env:RUNNER_TEMP 'Math3D-smoke-install/Math3D Dev.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Installed Dev executable is missing: $app" }
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'release-dev') -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one unsigned Dev installer, found $($installers.Count)." }
          $env:MATH3D_PACKAGED_APP_EXE = $app
          $env:MATH3D_RELEASE20_EXPECTED_VERSION = '2.0.0'
          $env:MATH3D_RELEASE20_JOURNEY_REPORT = Join-Path $env:RUNNER_TEMP 'dev-four-journeys-playwright.json'
          $sageReceipt = Join-Path $env:RUNNER_TEMP 'dev-four-journeys-sage.json'
          $receipt = Join-Path $env:RUNNER_TEMP 'dev-four-journeys-receipt.json'
          node scripts/release20-sage-oracle.mjs $sageReceipt
          if ($LASTEXITCODE -ne 0) { throw 'Live Sage oracle preflight failed.' }
          & (Join-Path $PWD 'node_modules/.bin/playwright.cmd') test --config playwright.release20-journeys.config.ts
          $playwrightExit = $LASTEXITCODE
          $commit = (git rev-parse HEAD).Trim()
          $installerHash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installedHash = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/check-release20-journeys.mjs $env:MATH3D_RELEASE20_JOURNEY_REPORT $sageReceipt $commit $installerHash $receipt --dev $installedHash
          if ($playwrightExit -ne 0 -or $LASTEXITCODE -ne 0) { throw 'Installed Dev four-journey rehearsal failed; inspect the receipt and Playwright report.' }

      - name: Upload unsigned Dev journey evidence
        if: ${{ always() && inputs.run_four_journeys }}
        uses: actions/upload-artifact@v7
        with:
          name: release20-unsigned-installed-rehearsal
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/dev-four-journeys-playwright.json
            ${{ runner.temp }}/dev-four-journeys-sage.json
            ${{ runner.temp }}/dev-four-journeys-receipt.json
            test-results/release20-journeys-playwright/**

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-source-installer-smoke-artifacts
          if-no-files-found: warn
          path: |
            release-dev/*.exe
            release-dev/builder-debug.yml
            release-dev/latest.yml
            playwright-report/**
            test-results/**

  upgrade-rehearsal:
    if: ${{ inputs.run_upgrade_rehearsal }}
    needs: release-smoke
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install exact test locks
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root test install failed.' }
          npm --prefix renderer ci
          if ($LASTEXITCODE -ne 0) { throw 'Renderer test install failed.' }
      - uses: actions/download-artifact@v7
        with:
          name: windows-source-installer-smoke-artifacts
          path: ${{ runner.temp }}/dev-artifacts
      - name: Download pinned published 1.7 assets
        shell: pwsh
        run: |
          $base = 'https://github.com/expert10000/Math3D/releases/download/v1.7.0'
          foreach ($name in @('Math3D-Setup-1.7.0.exe', 'SHA256SUMS.txt', 'candidate-manifest.json')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path $env:RUNNER_TEMP $name)
          }
      - name: Rehearse published 1.7 profile through unsigned Dev overlay
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'dev-artifacts') `
            -Filter 'Math3D Dev Setup 2.0.0.exe' -File -Recurse)
          if ($installers.Count -ne 1) { throw "Expected exactly one unsigned Dev installer, found $($installers.Count)." }
          ./scripts/release20-unsigned-dev-upgrade.ps1 `
            -OldInstaller (Join-Path $env:RUNNER_TEMP 'Math3D-Setup-1.7.0.exe') `
            -ChecksumsPath (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') `
            -ReleaseManifestPath (Join-Path $env:RUNNER_TEMP 'candidate-manifest.json') `
            -DevInstaller $installers[0].FullName `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'math3d-17-to-dev-upgrade') `
            -EvidencePath (Join-Path $env:RUNNER_TEMP 'release20-unsigned-dev-upgrade.json')
      - name: Upload unsigned Dev upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release20-unsigned-dev-upgrade-rehearsal
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/release20-unsigned-dev-upgrade.json
            ${{ runner.temp }}/math3d-17-to-dev-upgrade/seed.json
            ${{ runner.temp }}/math3d-17-to-dev-upgrade/verify.json
            ${{ runner.temp }}/math3d-17-to-dev-upgrade/rollback.json
            ${{ runner.temp }}/math3d-17-to-dev-upgrade/profile-inventory.json
