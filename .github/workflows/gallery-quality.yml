name: Gallery Quality

on:
  push:
    branches: [main]
    paths:
      - "renderer/**"
      - "tests/e2e/**"
      - "gallery-images/**"
      - ".github/workflows/gallery-quality.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
  pull_request:
    paths:
      - "renderer/**"
      - "tests/e2e/**"
      - "gallery-images/**"
      - ".github/workflows/gallery-quality.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"

jobs:
  gallery-e2e:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Install dependencies (root + renderer, retry)
        shell: pwsh
        run: |
          function Invoke-NpmWithRetry {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][scriptblock]$Command,
              [Parameter(Mandatory = $true)][string]$CleanupPath,
              [int]$MaxAttempts = 3
            )

            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              Write-Host "[$Label] attempt $attempt/$MaxAttempts"
              & $Command
              if ($LASTEXITCODE -eq 0) {
                return
              }

              if ($attempt -eq $MaxAttempts) {
                throw "[$Label] failed after $MaxAttempts attempts (exit $LASTEXITCODE)."
              }

              Write-Warning "[$Label] failed with exit $LASTEXITCODE. Cleaning up and retrying..."
              if (Test-Path $CleanupPath) {
                Remove-Item -Recurse -Force $CleanupPath -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds (15 * $attempt)
            }
          }

          Invoke-NpmWithRetry -Label "root npm ci" -Command { npm ci } -CleanupPath "node_modules"
          Invoke-NpmWithRetry -Label "renderer npm ci" -Command { npm --prefix renderer ci } -CleanupPath "renderer/node_modules"

      - name: Build core
        run: npm run build:core

      - name: Gallery visual regression
        run: npm run test:app:e2e:visual

      - name: Gallery thumbnail capture
        run: npm run test:app:e2e:thumbnails

      - name: Upload playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-e2e-artifacts
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
