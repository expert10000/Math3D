name: Windows Stable Two-App Signoff

on:
  workflow_dispatch:

jobs:
  build-candidates:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      theory_lab_sha: ${{ steps.lab_ref.outputs.sha }}
    env:
      electron_config_cache: ${{ github.workspace }}\.cache\electron
      MATH3D_CHANNEL: stable
      MATH3D_ELECTRON_DOWNLOAD_TIMEOUT_MS: "600000"
      MATH3D_ELECTRON_EXTRACT_TIMEOUT_MS: "180000"
      MATH3D_ELECTRON_DOWNLOAD_RETRIES: "2"
    steps:
      - name: Check out Math3D
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Set up Python for Math3D worker
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.electron_config_cache }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Resolve native binary cache
        id: native-cache-key
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $PWD '.cache/vcpkg-binaries'
          New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cacheRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "key=windows-2022-$env:ImageVersion-vcpkg-52fd90f2b7798d9fe6fef18fc1787db44574d704" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore native dependency binaries
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/vcpkg-binaries
          key: ${{ steps.native-cache-key.outputs.key }}

      - name: Install full release worker dependencies
        shell: pwsh
        run: |
          ./scripts/setup-cgal-python-worker.ps1 -Python (Get-Command python).Source -VcpkgCommit 52fd90f2b7798d9fe6fef18fc1787db44574d704 -FrozenRequirements
          $workerPython = Join-Path $PWD '.venv-worker/Scripts/python.exe'
          & $workerPython -m pip install pyinstaller mkdocs -r python/worker/requirements.freeze.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned worker dependencies failed' }
          "MATH3D_PYTHON=$workerPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $PWD '.venv-worker/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $PWD '.deps/vcpkg/installed/x64-windows/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Save native dependency cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/vcpkg-binaries
          key: ${{ steps.native-cache-key.outputs.key }}

      - name: Build full stable Math3D installer
        id: math_build
        shell: pwsh
        env:
          MATH3D_REQUIRE_PYGALMESH: '1'
          MATH3D_REQUIRE_CGAL: '1'
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Math3D npm ci failed' }
          npm --prefix renderer ci
          if ($LASTEXITCODE -ne 0) { throw 'Math3D renderer install failed' }
          npm run build:python-worker
          if ($LASTEXITCODE -ne 0) { throw 'Math3D worker build failed' }
          npm run build:core
          if ($LASTEXITCODE -ne 0) { throw 'Math3D core build failed' }
          npm run build:web
          if ($LASTEXITCODE -ne 0) { throw 'Math3D web build failed' }
          $env:CI = 'false'
          & .\node_modules\.bin\electron-builder.cmd --win nsis --config electron-builder.config.cjs --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Stable Math3D NSIS build failed' }

      - name: Verify packaged worker protocol
        shell: pwsh
        run: |
          node scripts/smoke-python-worker.mjs --exe release/win-unpacked/resources/python-worker/worker.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged worker protocol failed' }

      - name: Check out Theory Lab producer
        id: lab_checkout
        uses: actions/checkout@v7
        with:
          repository: expert10000/theory-lab
          ref: main
          path: theory-lab

      - name: Record exact Theory Lab source revision
        id: lab_ref
        shell: pwsh
        run: |
          $sha = (& git -C theory-lab rev-parse HEAD).Trim()
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up pinned Python for Theory Lab worker
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build full Theory Lab installer
        id: lab_build
        working-directory: theory-lab
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab npm ci failed' }
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab venv creation failed' }
          & .\.venv\Scripts\python.exe -m pip install -c workers/quantum-python/requirements.lock -e workers/quantum-python
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab pinned worker install failed' }
          & .\.venv\Scripts\python.exe -m pip install -r workers/quantum-python/requirements-packaging.txt
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab frozen worker dependencies failed' }
          $env:CI = 'false'
          npm run package:win:installer
          if ($LASTEXITCODE -ne 0) { throw 'Theory Lab NSIS build failed' }

      - name: Preserve exact candidate installers and hashes
        id: manifest
        shell: pwsh
        run: |
          $math = @(Get-ChildItem -LiteralPath release -Filter 'Math3D Setup *.exe' -File)
          $lab = @(Get-ChildItem -LiteralPath theory-lab/release -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          if ($math.Count -ne 1 -or $lab.Count -ne 1) { throw 'Expected exactly one installer from each build' }
          $candidate = 'candidate'
          New-Item -ItemType Directory -Path $candidate | Out-Null
          Copy-Item -LiteralPath $math[0].FullName -Destination (Join-Path $candidate $math[0].Name)
          Copy-Item -LiteralPath $lab[0].FullName -Destination (Join-Path $candidate $lab[0].Name)
          [ordered]@{
            schema = 'math3d/two-app-candidate/v1'
            createdAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            buildRunId = $env:GITHUB_RUN_ID
            math3d = [ordered]@{
              version = (Get-Content package.json -Raw | ConvertFrom-Json).version
              commit = (& git rev-parse HEAD).Trim()
              channel = 'stable'
              installerName = $math[0].Name
              installerSha256 = (Get-FileHash -LiteralPath $math[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            theoryLab = [ordered]@{
              version = (Get-Content theory-lab/package.json -Raw | ConvertFrom-Json).version
              commit = (& git -C theory-lab rev-parse HEAD).Trim()
              installerName = $lab[0].Name
              installerSha256 = (Get-FileHash -LiteralPath $lab[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $candidate 'candidate-manifest.json') -Encoding UTF8

      - name: Upload exact release-candidate files
        uses: actions/upload-artifact@v7
        with:
          name: two-app-stable-candidate
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          path: candidate/*

      - name: Record build failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          [ordered]@{
            schema = 'math3d/stable-two-app-signoff/v1'
            checkedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            status = 'failed-before-signoff'
            math3dBuild = '${{ steps.math_build.outcome }}'
            theoryLabCheckout = '${{ steps.lab_checkout.outcome }}'
            theoryLabBuild = '${{ steps.lab_build.outcome }}'
            candidateManifest = '${{ steps.manifest.outcome }}'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath test-results/build-failure.json -Encoding UTF8

      - name: Upload build failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: two-app-build-failure
          if-no-files-found: ignore
          path: test-results/build-failure.json

  signoff-installed-candidate:
    needs: build-candidates
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Math3D test harness
        uses: actions/checkout@v7

      - name: Check out exact Theory Lab source metadata
        uses: actions/checkout@v7
        with:
          repository: expert10000/theory-lab
          ref: ${{ needs.build-candidates.outputs.theory_lab_sha }}
          path: theory-lab

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install Math3D test harness only
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Math3D test harness npm ci failed' }

      - name: Download exact candidate files
        uses: actions/download-artifact@v7
        with:
          name: two-app-stable-candidate
          path: candidate

      - name: Install candidate files and run installed UI handoff
        id: signoff
        shell: pwsh
        run: |
          $math = @(Get-ChildItem -LiteralPath candidate -Filter 'Math3D Setup *.exe' -File)
          $lab = @(Get-ChildItem -LiteralPath candidate -Filter 'Quantum-Hamiltonian-Lab-Setup-*.exe' -File)
          if ($math.Count -ne 1 -or $lab.Count -ne 1) { throw 'Expected exactly one downloaded installer of each type' }
          & scripts/stable-two-app-signoff.ps1 -TheoryLabRepo theory-lab `
            -Math3DInstaller $math[0].FullName -TheoryLabInstaller $lab[0].FullName `
            -CandidateManifest (Join-Path $PWD 'candidate/candidate-manifest.json') `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'stable-two-app-signoff') `
            -EvidencePath (Join-Path $PWD 'test-results/stable-two-app-signoff.json')
          if ($LASTEXITCODE -ne 0) { throw 'Stable two-app signoff failed' }

      - name: Record failure before installed signoff
        if: always()
        shell: pwsh
        run: |
          $path = 'test-results/stable-two-app-signoff.json'
          if (-not (Test-Path -LiteralPath $path)) {
            New-Item -ItemType Directory -Path 'test-results' -Force | Out-Null
            [ordered]@{
              schema = 'math3d/stable-two-app-signoff/v1'
              checkedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              environment = 'fresh Windows installer VM'
              status = 'failed-before-signoff'
              signoff = '${{ steps.signoff.outcome }}'
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $path -Encoding UTF8
          }

      - name: Upload installer hashes and UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-two-app-signoff
          if-no-files-found: error
          path: |
            test-results/stable-two-app-signoff.json
            test-results/playwright/quantum-installed-ui-round*/trace.zip
            test-results/playwright/quantum-installed-ui-round*/test-failed-*.png

  upgrade-installed-candidate:
    needs: [build-candidates, signoff-installed-candidate]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out Math3D upgrade test harness
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install test harness dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Math3D npm ci failed' }

      - name: Download published v1.6.0 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path installers/published -Force | Out-Null
          gh release download v1.6.0 --repo expert10000/Math3D `
            --pattern 'Math3D-Setup-1.6.0.exe' --dir installers/published
          if ($LASTEXITCODE -ne 0) { throw 'Published v1.6.0 download failed' }

      - name: Download exact candidate files
        uses: actions/download-artifact@v7
        with:
          name: two-app-stable-candidate
          path: installers/candidate

      - name: Upgrade published v1.6.0 and run installed Lab handoff
        id: upgrade
        shell: pwsh
        run: |
          & scripts/stable-upgrade-two-app-signoff.ps1 `
            -PublishedInstaller (Join-Path $PWD 'installers/published/Math3D-Setup-1.6.0.exe') `
            -CandidateDirectory (Join-Path $PWD 'installers/candidate') `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'stable-upgrade-two-app') `
            -EvidencePath (Join-Path $PWD 'test-results/stable-upgrade-two-app.json')
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade signoff failed' }

      - name: Record setup failure
        if: always()
        shell: pwsh
        run: |
          $path = 'test-results/stable-upgrade-two-app.json'
          if (-not (Test-Path -LiteralPath $path)) {
            New-Item -ItemType Directory -Path test-results -Force | Out-Null
            [ordered]@{
              schema = 'math3d/stable-upgrade-two-app/v1'
              checkedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              status = 'failed-before-signoff'
              upgrade = '${{ steps.upgrade.outcome }}'
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $path -Encoding UTF8
          }

      - name: Upload upgrade evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-upgrade-two-app-signoff
          if-no-files-found: error
          path: |
            test-results/stable-upgrade-two-app.json
            test-results/playwright/stable-upgrade-project-settings*/trace.zip
            test-results/playwright/quantum-installed-ui-round*/trace.zip
            test-results/playwright/*/test-failed-*.png
