name: Windows Installed Prerelease Trial

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Existing 1.7 rc.4 trial or exact self-signed 2.0 installed qualification
        required: true
        type: choice
        options: [rc4, signed-20, diag-20]
        default: rc4
      draft_release_id:
        description: Unpublished draft release ID containing only the signed installer and public manifests
        required: false
        type: string
      source_commit:
        description: Approved 40-character installer source commit
        required: false
        type: string
      installer_sha256:
        description: Approved signed installer SHA-256
        required: false
        type: string
      freeze_sha256:
        description: Approved freeze manifest SHA-256
        required: false
        type: string
      signer_thumbprint:
        description: Approved self-signed signer thumbprint
        required: false
        type: string

permissions:
  contents: read

jobs:
  installed-rc4-trial:
    if: inputs.trial == 'rc4'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install test harness
        run: npm ci
      - name: Download and verify frozen rc.4 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path candidate -Force | Out-Null
          gh release download v1.7.0-rc.4 --repo expert10000/Math3D --pattern 'Math3D.Setup.1.7.0-rc.4.exe' --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'rc.4 installer download failed' }
          $installer = (Resolve-Path -LiteralPath 'candidate/Math3D.Setup.1.7.0-rc.4.exe').Path
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'bb447b5f511f30f64481c0d1cebd13ff272d37010ba5e87eddf12f1bad1dfa33'
          if ($actual -ne $expected) { throw "rc.4 installer hash mismatch: $actual" }
          $root = Join-Path $env:RUNNER_TEMP 'math3d-rc4-trial'
          New-Item -ItemType Directory -Path $root | Out-Null
          $install = Join-Path $root 'installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/CURRENTUSER', "/D=$install") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "rc.4 installer exited $($process.ExitCode)" }
          $exe = Join-Path $install 'Math3D.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Installed Math3D.exe missing' }
          "MATH3D_E2E_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          [ordered]@{schema='math3d/installed-prerelease-trial/v1'; tag='v1.7.0-rc.4'; sourceCommit='6c8243585c9d69a31d584c3b66fdd567acdab124'; installerSha256=$actual; installedExe=$exe; checkedAtUtc=(Get-Date).ToUniversalTime().ToString('o')} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'trial.json') -Encoding UTF8
          "MATH3D_RC4_TRIAL_EVIDENCE=$(Join-Path $root 'trial.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise installed QWZ and hydrogen previews
        shell: pwsh
        run: |
          npx playwright test tests/e2e/quantum-installed-prerelease-trial.spec.ts --reporter=list
          if ($LASTEXITCODE -ne 0) { throw 'Installed rc.4 preview trial failed' }
      - name: Upload trial evidence and failure trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-rc4-trial
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/math3d-rc4-trial/trial.json
            test-results/playwright/**/trace.zip
            test-results/playwright/**/*.png

  selfsigned-fresh:
    if: inputs.trial == 'signed-20'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Download and attest exact unpublished signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.draft_release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 }}
          SIGNER_THUMBPRINT: ${{ inputs.signer_thumbprint }}
        run: |
          $checkoutSha = (& git rev-parse HEAD).Trim()
          if ($checkoutSha -ne $env:SOURCE_COMMIT) { throw 'Workflow checkout differs from approved installer source.' }
          ./scripts/stage-release20-selfsigned-draft.ps1 `
            -ReleaseId $env:RELEASE_ID -SourceCommit $env:SOURCE_COMMIT `
            -InstallerSha256 $env:INSTALLER_SHA256 -FreezeSha256 $env:FREEZE_SHA256 `
            -SignerThumbprint $env:SIGNER_THUMBPRINT `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'selfsigned-candidate')
      - name: Install exact test dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root lockfile install failed.' }
          npm --prefix renderer ci
          if ($LASTEXITCODE -ne 0) { throw 'Renderer lockfile install failed.' }
      - name: Run signed candidate Fresh acceptance
        shell: pwsh
        env:
          MATH3D_RELEASE20_SAGE_SERVICE_URL: ${{ secrets.MATH3D_RELEASE20_SAGE_SERVICE_URL }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          SIGNER_THUMBPRINT: ${{ inputs.signer_thumbprint }}
        run: |
          $evidence = Join-Path $env:TEMP 'math3d-selfsigned-fresh'
          ./scripts/release20-selfsigned-installed.ps1 -Mode Fresh `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'selfsigned-candidate') -EvidenceRoot $evidence `
            -SourceCommit $env:SOURCE_COMMIT -InstallerSha256 $env:INSTALLER_SHA256 `
            -SignerThumbprint $env:SIGNER_THUMBPRINT
          $receipt = Get-Content -LiteralPath (Join-Path $evidence 'fresh-receipt.json') -Raw | ConvertFrom-Json
          if ($receipt.status -ne 'passed' -or $receipt.installedJourneysQualified -ne $true) {
            throw 'Fresh installed acceptance is incomplete; inspect the uploaded receipt.'
          }
      - name: Collect Fresh evidence
        if: always()
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'selfsigned-fresh-evidence'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'selfsigned-candidate/stage-receipt.json'
          if (Test-Path -LiteralPath $stage) { Copy-Item -LiteralPath $stage -Destination $output }
          $evidence = Join-Path $env:TEMP 'math3d-selfsigned-fresh'
          if (Test-Path -LiteralPath $evidence) { Copy-Item -Path (Join-Path $evidence '*') -Destination $output -Recurse }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release20-selfsigned-fresh-evidence
          path: |
            ${{ runner.temp }}/selfsigned-fresh-evidence/**
            test-results/playwright/**/trace.zip
          if-no-files-found: warn

  selfsigned-upgrade:
    if: inputs.trial == 'signed-20' || inputs.trial == 'diag-20'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Download and attest exact unpublished signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.draft_release_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          FREEZE_SHA256: ${{ inputs.freeze_sha256 }}
          SIGNER_THUMBPRINT: ${{ inputs.signer_thumbprint }}
          TRIAL: ${{ inputs.trial }}
        run: |
          $checkoutSha = (& git rev-parse HEAD).Trim()
          if ($checkoutSha -ne $env:SOURCE_COMMIT) {
            if ($env:TRIAL -ne 'diag-20') { throw 'Workflow checkout differs from approved installer source.' }
            & git merge-base --is-ancestor $env:SOURCE_COMMIT HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Diagnostic harness does not descend from approved installer source.' }
          }
          ./scripts/stage-release20-selfsigned-draft.ps1 `
            -ReleaseId $env:RELEASE_ID -SourceCommit $env:SOURCE_COMMIT `
            -InstallerSha256 $env:INSTALLER_SHA256 -FreezeSha256 $env:FREEZE_SHA256 `
            -SignerThumbprint $env:SIGNER_THUMBPRINT `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'selfsigned-candidate')
      - name: Install exact test dependencies and published 1.7 assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root lockfile install failed.' }
          npm --prefix renderer ci
          if ($LASTEXITCODE -ne 0) { throw 'Renderer lockfile install failed.' }
          $old = Join-Path $env:RUNNER_TEMP 'published-1.7'
          New-Item -ItemType Directory -Path $old | Out-Null
          gh release download v1.7.0 --repo expert10000/Math3D `
            --pattern Math3D-Setup-1.7.0.exe --pattern candidate-manifest.json `
            --pattern SHA256SUMS.txt --dir $old
          if ($LASTEXITCODE -ne 0) { throw 'Published 1.7 asset download failed.' }
      - name: Run signed candidate Upgrade and rollback acceptance
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
          SIGNER_THUMBPRINT: ${{ inputs.signer_thumbprint }}
          TRIAL: ${{ inputs.trial }}
        run: |
          if ($env:TRIAL -eq 'diag-20') { $env:MATH3D_UPGRADE_DIAGNOSTICS = '1' }
          $evidence = Join-Path $env:TEMP 'math3d-selfsigned-upgrade'
          ./scripts/release20-selfsigned-installed.ps1 -Mode Upgrade `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'selfsigned-candidate') `
            -OldInstaller (Join-Path $env:RUNNER_TEMP 'published-1.7/Math3D-Setup-1.7.0.exe') `
            -EvidenceRoot $evidence -SourceCommit $env:SOURCE_COMMIT `
            -InstallerSha256 $env:INSTALLER_SHA256 -SignerThumbprint $env:SIGNER_THUMBPRINT
          $receipt = Get-Content -LiteralPath (Join-Path $evidence 'upgrade-receipt.json') -Raw | ConvertFrom-Json
          if ($env:TRIAL -eq 'diag-20') {
            if ($receipt.status -ne 'diagnostic' -or $receipt.diagnosticOnly -ne $true) {
              throw 'Diagnostic-only rollback did not complete; inspect the limited diagnostic artifact.'
            }
            Write-Host 'Diagnostic-only rollback completed; this is not installed qualification.'
            exit 0
          }
          if ($receipt.status -ne 'passed' -or $receipt.checks.published17Rollback -ne 'passed') {
            throw 'Upgrade and rollback acceptance is incomplete; inspect the uploaded receipt.'
          }
      - name: Collect Upgrade evidence
        if: always()
        shell: pwsh
        env:
          TRIAL: ${{ inputs.trial }}
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'selfsigned-upgrade-evidence'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP 'selfsigned-candidate/stage-receipt.json'
          if (Test-Path -LiteralPath $stage) { Copy-Item -LiteralPath $stage -Destination $output }
          $evidence = Join-Path $env:TEMP 'math3d-selfsigned-upgrade'
          if (Test-Path -LiteralPath $evidence) {
            if ($env:TRIAL -eq 'diag-20') {
              Get-ChildItem -LiteralPath $evidence -File -Filter '*-diagnostic-*.json' | Copy-Item -Destination $output
              $receipt = Join-Path $evidence 'upgrade-receipt.json'
              if (Test-Path -LiteralPath $receipt) { Copy-Item -LiteralPath $receipt -Destination $output }
            } else { Copy-Item -Path (Join-Path $evidence '*') -Destination $output -Recurse }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.trial == 'diag-20' && 'release20-upgrade-diagnostic' || 'release20-selfsigned-upgrade-evidence' }}
          path: ${{ runner.temp }}/selfsigned-upgrade-evidence/**
          if-no-files-found: warn
