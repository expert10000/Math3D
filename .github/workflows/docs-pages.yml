name: Docs Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install npm dependencies (root)
        run: npm ci

      - name: Install npm dependencies (renderer)
        run: npm --prefix renderer ci

      - name: Generate TypeDoc API
        run: npm run docs:api

      - name: Install MkDocs
        run: python -m pip install -r docs/requirements-docs.txt

      - name: Build MkDocs site
        run: npm run docs:site

      - name: Build web frontend bundle for Pages
        run: npm run build:web:pages

      - name: Build landing page bundle for Pages
        run: npm run build:public-site

      - name: Stage web frontend under /app
        shell: bash
        run: |
          rm -rf site/app
          mkdir -p site/app
          cp -R apps/web/dist/. site/app/

      - name: Stage landing page under /landing
        shell: bash
        run: |
          rm -rf site/landing
          mkdir -p site/landing
          cp -R apps/public-site/dist/. site/landing/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
