name: Scientific Project Web Packages
on:
  pull_request:
    paths:
      - 'packages/core/src/**'
      - 'renderer/src/projects/**'
      - 'renderer/src/vectorfield3d/**'
      - 'renderer/src/graph2d/GraphsWorkspace.tsx'
      - 'renderer/src/components/ProjectWorkspacePanel.tsx'
      - 'tests/fixtures/graph-field/portableScientificProject.ts'
      - 'tests/graph2d-web/scientificProjectPackages.spec.ts'
      - 'playwright.projects.config.ts'
      - '.github/workflows/scientific-project-web-packages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scientific-project-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm --prefix renderer ci --ignore-scripts
      - name: Focused package and resource regressions
        run: node renderer/node_modules/vitest/vitest.mjs run --config renderer/vite.config.ts renderer/src/vectorfield3d/scientificProjectPackages.test.ts renderer/src/vectorfield3d/fieldExplorerScientificWorkflow.test.ts renderer/src/vectorfield3d/fieldExplorerWorkflow.test.tsx renderer/src/projects/projectResources.test.ts renderer/src/projects/projectResourceArchive.test.ts tests/unit/mobileProjectResources.test.ts --maxWorkers=2
      - name: Type check and build the actual web application
        run: npm run typecheck:noemit && npm run build:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real browser import, cold restart, and damaged-source recovery
        run: npx playwright test --config playwright.projects.config.ts scientificProjectPackages.spec.ts --reporter=list
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scientific-project-web-${{ github.sha }}
          path: test-results/projects-web/**
          retention-days: 14
