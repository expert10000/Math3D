name: Windows Quantum Installed Rollback Retry

on:
  workflow_dispatch:

jobs:
  rollback-pinned-candidate:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out Math3D rollback test harness
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install test harness dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Math3D npm ci failed' }

      - name: Download exact QEC candidate and pre-QEC rollback files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42123298884 --repo expert10000/Math3D `
            --name two-app-stable-candidate --dir installers/candidate
          if ($LASTEXITCODE -ne 0) { throw 'Pinned QEC candidate download failed' }
          gh run download 42035098178 --repo expert10000/Math3D `
            --name two-app-stable-candidate --dir installers/rollback
          if ($LASTEXITCODE -ne 0) { throw 'Pinned pre-QEC candidate download failed' }

      - name: Uninstall QEC candidate and restore pinned v1 and v2 readers
        id: rollback
        shell: pwsh
        run: |
          & scripts/stable-quantum-installed-rollback.ps1 `
            -CandidateDirectory (Join-Path $PWD 'installers/candidate') `
            -RollbackDirectory (Join-Path $PWD 'installers/rollback') `
            -ExpectedCandidateCommit '49485e816fcfc7b46d5da1634c6746a631343f8e' `
            -ExpectedCandidateSha256 '63442950be85edb6f90f0321a37781650bde2c16cf4b32923aa64a3ae2cb6535' `
            -InstallRoot (Join-Path $env:RUNNER_TEMP 'stable-quantum-installed-rollback') `
            -EvidencePath (Join-Path $PWD 'test-results/stable-quantum-installed-rollback.json')
          if ($LASTEXITCODE -ne 0) { throw 'Installed quantum rollback failed' }

      - name: Record setup failure
        if: always()
        shell: pwsh
        run: |
          $path = 'test-results/stable-quantum-installed-rollback.json'
          if (-not (Test-Path -LiteralPath $path)) {
            New-Item -ItemType Directory -Path test-results -Force | Out-Null
            [ordered]@{
              schema = 'math3d/stable-quantum-installed-rollback/v1'
              checkedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              status = 'failed-before-signoff'
              rollback = '${{ steps.rollback.outcome }}'
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $path -Encoding UTF8
          }

      - name: Upload rollback evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stable-quantum-installed-rollback
          if-no-files-found: error
          path: |
            test-results/stable-quantum-installed-rollback.json
            test-results/playwright/quantum-installed-rollback*/trace.zip
            test-results/playwright/quantum-installed-rollback*/test-failed-*.png
